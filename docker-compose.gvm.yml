# -----------------------------------------------------------------------------
# Fase 2d: stack de GVM/Greenbone Community Edition.
#
# Copiado 1:1 (mismas imágenes, mismos volúmenes, mismo orden de
# dependencias) del docker-compose oficial de Greenbone, descargado en vivo
# el 21/08/2026 desde https://greenbone.github.io/docs/latest/_static/compose.yaml
# — ver la copia de referencia en
# gvm-integration/referencia-oficial/compose-oficial-greenbone-24.10.yaml.
# No se reinventa la topología interna: es la que Greenbone prueba y
# documenta.
#
# Se levanta JUNTO con el docker-compose.yml del laboratorio (mismo proyecto,
# mismo docker-compose.yml de base):
#   docker compose -f docker-compose.yml -f docker-compose.gvm.yml up -d --build
#
# Decisión de arquitectura para la red (investigado en vivo, ver
# docs/RUNBOOK-fase-2d-gvm.md punto 3.2): en esta versión containerizada,
# GMP (el protocolo que habla gvmd) SOLO se expone por socket Unix
# (gvmd_socket_vol, montado en /run/gvmd) — el docker-compose oficial no
# ofrece ninguna opción de TCP (el puerto 9390 que documentan otras fuentes
# es de los appliances GSM viejos, no de este stack). Por eso:
#   - Todo el stack interno de GVM (feeds, redis, postgres propio, gvmd,
#     gsad/gsa/nginx, openvasd) se queda en la red "default" implícita de
#     este proyecto, sin declarar networks explícitas — es la topología tal
#     cual la prueba Greenbone.
#   - "ospd-openvas" es el ÚNICO contenedor de GVM que se agrega también a
#     "labnet" (IP estática 172.28.0.30): es el motor de escaneo real, el
#     único que necesita alcanzar target1 (172.28.0.20) por red. Se queda
#     además en "default" porque necesita resolver el alias "openvasd" (ver
#     más abajo) y comparte volúmenes de socket con redis-server/gvmd.
#   - "n8n" (definido en docker-compose.yml) solo gana acá un volumen
#     adicional: el socket de gvmd, para poder correr gvm-cli en el nodo
#     "Execute Command" sin necesitar red — mismo mecanismo que usa el
#     propio contenedor oficial "gvm-tools".
# -----------------------------------------------------------------------------

services:
  vulnerability-tests:
    image: registry.community.greenbone.net/community/vulnerability-tests
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - vt_data_vol:/mnt

  notus-data:
    image: registry.community.greenbone.net/community/notus-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - notus_data_vol:/mnt

  scap-data:
    image: registry.community.greenbone.net/community/scap-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - scap_data_vol:/mnt

  cert-bund-data:
    image: registry.community.greenbone.net/community/cert-bund-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt

  dfn-cert-data:
    image: registry.community.greenbone.net/community/dfn-cert-data
    environment:
      KEEP_ALIVE: 1
    volumes:
      - cert_data_vol:/mnt
    depends_on:
      cert-bund-data:
        condition: service_healthy

  data-objects:
    image: registry.community.greenbone.net/community/data-objects
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt

  report-formats:
    image: registry.community.greenbone.net/community/report-formats
    environment:
      FEED_RELEASE: "24.10"
      KEEP_ALIVE: 1
    volumes:
      - data_objects_vol:/mnt
    depends_on:
      data-objects:
        condition: service_healthy

  gpg-data:
    image: registry.community.greenbone.net/community/gpg-data
    volumes:
      - gpg_data_vol:/mnt

  redis-server:
    image: registry.community.greenbone.net/community/redis-server
    deploy:
      restart_policy:
        condition: any
    volumes:
      - redis_socket_vol:/run/redis/

  pg-gvm:
    image: registry.community.greenbone.net/community/pg-gvm:stable
    deploy:
      restart_policy:
        condition: any
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm-migrator:
        condition: service_completed_successfully

  pg-gvm-migrator:
    image: registry.community.greenbone.net/community/pg-gvm-migrator:stable
    deploy:
      restart_policy:
        condition: none
    volumes:
      - psql_data_vol:/var/lib/postgresql
      - psql_socket_vol:/var/run/postgresql

  gvmd:
    image: registry.community.greenbone.net/community/gvmd:stable
    deploy:
      restart_policy:
        condition: any
    volumes:
      - gvmd_data_vol:/var/lib/gvm
      - scap_data_vol:/var/lib/gvm/scap-data/
      - cert_data_vol:/var/lib/gvm/cert-data
      - data_objects_vol:/var/lib/gvm/data-objects/gvmd
      - vt_data_vol:/var/lib/openvas/plugins
      - psql_data_vol:/var/lib/postgresql
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
      - psql_socket_vol:/var/run/postgresql
    depends_on:
      pg-gvm:
        condition: service_started
      scap-data:
        condition: service_healthy
      cert-bund-data:
        condition: service_healthy
      dfn-cert-data:
        condition: service_healthy
      data-objects:
        condition: service_healthy
      report-formats:
        condition: service_healthy

  gsa:
    image: registry.community.greenbone.net/community/gsa:stable-slim
    environment:
      MOUNT_PATH: "/mnt/web"
      KEEP_ALIVE: 1
    healthcheck:
      test: [ "CMD-SHELL", "test -e /run/gsa/copying.done" ]
      start_period: 5s
    volumes:
      - gsa_data_vol:/mnt/web

  gsad:
    image: registry.community.greenbone.net/community/gsad:stable
    deploy:
      restart_policy:
        condition: any
    environment:
      GSAD_HTTP_ONLY: "true"
      GSAD_API_ONLY: "true"
      GSAD_FOREGROUND: "true"
    volumes:
      - gvmd_socket_vol:/run/gvmd
    depends_on:
      gvmd:
        condition: service_started

  gvm-config:
    image: registry.community.greenbone.net/community/gvm-config:latest
    environment:
      ENABLE_NGINX_CONFIG: true
      ENABLE_TLS_GENERATION: true
    volumes:
      - nginx_config_vol:/mnt/nginx/configs
      - nginx_certificates_vol:/mnt/nginx/certs

  # Interfaz web de GVM (GSA), solo accesible desde el propio host
  # (127.0.0.1) — igual de criterio que el resto del proyecto: nada se
  # expone fuera de lo estrictamente necesario.
  nginx:
    image: registry.community.greenbone.net/community/nginx:latest
    ports:
      - 127.0.0.1:443:443
      - 127.0.0.1:9392:9392
    volumes:
      - nginx_config_vol:/etc/nginx/conf.d:ro
      - nginx_certificates_vol:/etc/nginx/certs:ro
      - gsa_data_vol:/usr/share/nginx/html:ro
    deploy:
      restart_policy:
        condition: any
    depends_on:
      gvm-config:
        condition: service_completed_successfully
      gsa:
        condition: service_healthy
      gsad:
        condition: service_started

  # Ajusta nivel de log de openvas-scanner y saca su log de /var/log/gvm
  # (para no interferir con logs de otros componentes).
  configure-openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/mnt
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        printf "table_driven_lsc = yes\nopenvasd_server = http://openvasd:80\n" > /mnt/openvas.conf
        sed "s/127/128/" /etc/openvas/openvas_log.conf | sed 's/gvm/openvas/' > /mnt/openvas_log.conf
        chmod 644 /mnt/openvas.conf
        chmod 644 /mnt/openvas_log.conf
        touch /var/log/openvas/openvas.log
        chmod 666 /var/log/openvas/openvas.log

  # Solo muestra los logs de openvas (utilidad de diagnóstico, no crítica).
  openvas:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
    command:
      - /bin/sh
      - -c
      - |
        cat /etc/openvas/openvas.conf
        tail -f /var/log/openvas/openvas.log
    depends_on:
      configure-openvas:
        condition: service_completed_successfully

  openvasd:
    image: registry.community.greenbone.net/community/openvas-scanner:stable
    deploy:
      restart_policy:
        condition: any
    environment:
      # service_notus desactiva todo lo demás de openvasd, dejando solo el
      # motor Notus (detección basada en versión, sin credenciales) — es lo
      # único que necesita este laboratorio.
      OPENVASD_MODE: service_notus
      GNUPGHOME: /etc/openvas/gnupg
      LISTENING: 0.0.0.0:80
    volumes:
      - openvas_data_vol:/etc/openvas
      - openvas_log_data_vol:/var/log/openvas
      - gpg_data_vol:/etc/openvas/gnupg
      - notus_data_vol:/var/lib/notus
    depends_on:
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy
      configure-openvas:
        condition: service_completed_successfully
      gpg-data:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          - openvasd

  # Único contenedor de GVM conectado a "labnet": es el motor de escaneo
  # real (usa Nmap/Boreas internamente), necesita alcanzar target1 por red.
  ospd-openvas:
    image: registry.community.greenbone.net/community/ospd-openvas:stable
    deploy:
      restart_policy:
        condition: any
    hostname: ospd-openvas.local
    cap_add:
      - NET_ADMIN # para capturar paquetes en modo promiscuo
      - NET_RAW # sockets crudos, p. ej. detección de vivo de Boreas
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
    command:
      [
        "ospd-openvas",
        "-f",
        "--config",
        "/etc/gvm/ospd-openvas.conf",
        "--notus-feed-dir",
        "/var/lib/notus/advisories",
        "-m",
        "666",
      ]
    volumes:
      - gpg_data_vol:/etc/openvas/gnupg
      - vt_data_vol:/var/lib/openvas/plugins
      - notus_data_vol:/var/lib/notus
      - ospd_openvas_socket_vol:/run/ospd
      - redis_socket_vol:/run/redis/
      - openvas_data_vol:/etc/openvas/
      - openvas_log_data_vol:/var/log/openvas
    networks:
      default: {}
      labnet:
        ipv4_address: 172.28.0.30
    depends_on:
      redis-server:
        condition: service_started
      gpg-data:
        condition: service_completed_successfully
      configure-openvas:
        condition: service_completed_successfully
      vulnerability-tests:
        condition: service_healthy
      notus-data:
        condition: service_healthy

  # Contenedor oficial de gvm-tools, útil para probar GMP a mano (paso 3.3
  # del runbook) sin depender de que n8n ya tenga gvm-cli funcionando.
  gvm-tools:
    image: registry.community.greenbone.net/community/gvm-tools
    volumes:
      - gvmd_socket_vol:/run/gvmd
      - ospd_openvas_socket_vol:/run/ospd
    depends_on:
      - gvmd
      - ospd-openvas

  # n8n ya está definido en docker-compose.yml; acá se agrega el volumen del
  # socket de gvmd (se fusiona con sus volúmenes existentes) y las
  # credenciales de GMP como variables de entorno del proceso — así los
  # nodos "Execute Command" las leen vía $GVM_ADMIN_USER/$GVM_ADMIN_PASSWORD
  # en el comando de shell, en vez de tener la contraseña escrita en texto
  # plano dentro del JSON del workflow (que sí se commitea a git).
  n8n:
    volumes:
      - gvmd_socket_vol:/run/gvmd
    environment:
      - GVM_ADMIN_USER=${GVM_ADMIN_USER}
      - GVM_ADMIN_PASSWORD=${GVM_ADMIN_PASSWORD}

volumes:
  gpg_data_vol:
  scap_data_vol:
  cert_data_vol:
  data_objects_vol:
  gvmd_data_vol:
  psql_data_vol:
  vt_data_vol:
  notus_data_vol:
  psql_socket_vol:
  gvmd_socket_vol:
  ospd_openvas_socket_vol:
  redis_socket_vol:
  openvas_data_vol:
  openvas_log_data_vol:
  gsa_data_vol:
  nginx_config_vol:
  nginx_certificates_vol:
