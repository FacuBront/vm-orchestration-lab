{% extends 'base.html' %}
{% import '_macros.html' as m %}
{% block titulo %}{{ titulo }} · {{ PRODUCT_NAME }}{% endblock %}

{% block cuerpo %}
<div class="grid min-h-screen place-items-center px-4">
  <div class="max-w-md text-center">
    <a href="{{ url_for('landing') }}" class="inline-flex">{{ m.marca() }}</a>
    <p class="mt-10 font-mono text-5xl font-semibold text-slate-600">{{ codigo }}</p>
    <h1 class="mt-3 text-2xl font-bold text-white">{{ titulo }}</h1>
    <p class="mt-2 text-slate-400">{{ detalle }}</p>
    <a href="{{ url_for('panel') }}" class="mt-8 inline-flex items-center gap-2 rounded-lg border border-borde px-4 py-2 text-sm text-slate-200 hover:border-acento hover:text-acento">
      {{ m.icono('volver', 'w-4 h-4') }}Ir al panel
    </a>
  </div>
</div>
{% endblock %}
